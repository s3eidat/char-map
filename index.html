<body data-tool="char-map">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Char Map</h1>
    <p>Arrows, math, currency, typography, box drawing, Greek, accents and Arabic marks. Click to copy, and get the code point, HTML entity, CSS and JavaScript escapes.</p>
  </section>

  <section class="card">
    <label class="sr" for="q">Search characters</label>
    <input type="search" class="input cm-q" id="q" dir="auto" autocomplete="off" spellcheck="false" placeholder="Search by name, character, code point or entity: arrow, euro, U+00E9, &amp;rarr, شدة…">
    <div class="cm-cats mt" id="cats" role="group" aria-label="Category"></div>
  </section>

  <div class="cm-layout mt">
    <section class="card">
      <div class="row between">
        <h2 id="title">All characters</h2>
        <span class="faint" id="count"></span>
      </div>
      <div class="cm-grid" id="grid" role="list"></div>
      <div class="empty" id="empty" hidden><b>Nothing found</b>Try a different word, or type a code point like U+2192.</div>
    </section>

    <aside class="card cm-detail">
      <div class="cm-big" id="big" dir="ltr">→</div>
      <b class="cm-name" id="dname"></b>
      <div class="tbl-wrap mt">
        <table class="tbl cm-codes"><tbody id="codes"></tbody></table>
      </div>
      <label class="field mt" for="collect">Collected <span class="faint">(every character you click is added here)</span>
        <span class="cm-collect">
          <input type="text" class="input" id="collect" dir="auto" spellcheck="false" placeholder="Click characters to build a string">
          <button class="btn icon" id="ccopy" aria-label="Copy collected text" title="Copy"><svg class="i"><use href="#i-copy"/></svg></button>
          <button class="btn icon ghost" id="cclear" aria-label="Clear collected text" title="Clear"><svg class="i"><use href="#i-trash"/></svg></button>
        </span>
      </label>
    </aside>
  </div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
